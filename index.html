*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#161617;color:#eee;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:radial-gradient(ellipse at 50% 35%,#2a2a2d 0,#161617 60%)}
#stage{position:relative;flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center;perspective:1400px;padding-top:calc(16px + env(safe-area-inset-top))}
#scaler{transform-origin:top center;transform:scale(var(--s,1))}
#tilt{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
#tilt.dragging{transition:none}
/* ---------- body ---------- */
.ipod{position:relative;width:400px;height:664px;border-radius:38px;padding:3px;
  background:linear-gradient(135deg,#fdfdfd 0,#c9cacc 18%,#f4f4f5 40%,#a9abaf 62%,#eeeeef 82%,#b7b8bb 100%);
  box-shadow:0 30px 50px -18px rgba(0,0,0,.65),0 2px 3px rgba(0,0,0,.4);
  -webkit-box-reflect:below 8px linear-gradient(transparent 72%,rgba(255,255,255,.07) 86%,rgba(255,255,255,.26) 100%);}
.ipod::after{content:"";position:absolute;left:8%;right:8%;bottom:-26px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%);filter:blur(6px);z-index:-1}
.face{position:relative;width:100%;height:100%;border-radius:35px;overflow:hidden;
  background:linear-gradient(160deg,#ffffff 0,#f3f3f3 35%,#e9e9ea 70%,#f6f6f6 100%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 6px rgba(0,0,0,.08),inset 0 0 0 1px rgba(0,0,0,.06)}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.35) 100%)}
/* ---------- screen ---------- */
.bezel{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:262px;height:198px;border-radius:9px;
  background:linear-gradient(180deg,#5a5c5f,#3c3e41);padding:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 #fff}
.lcd{position:relative;width:100%;height:100%;border-radius:3px;overflow:hidden;font-family:"PodPixel",monospace;color:#22262b;
  background:linear-gradient(180deg,#bcc0b8,#a9ada5);transition:background .4s,filter .4s}
.lcd.lit{background:linear-gradient(170deg,#e5eefb 0,#c6d6ec 55%,#b7cae5 100%)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 2px),linear-gradient(160deg,rgba(255,255,255,.35),transparent 40%)}
.bar{position:relative;height:25px;margin:0 6px;border-bottom:2px solid #2c3036;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:.5px}
.bar .ttl{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .pl{position:absolute;left:1px;top:7px;width:0;height:0;border-left:9px solid #22262b;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent;display:none}
.bar .pl.paused{border:0;width:9px;height:11px;top:7px;background:linear-gradient(90deg,#22262b 0 3px,transparent 3px 6px,#22262b 6px 9px)}
.bar .pl.on{display:block}
.batt{position:absolute;right:0;top:7px;width:22px;height:11px;border:1.5px solid #22262b;border-radius:2px;padding:1px;display:flex;gap:1px}
.batt::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:#22262b}
.batt i{flex:1;background:#22262b}
.view{position:absolute;left:0;right:0;top:27px;bottom:0}
/* list */
.list{position:absolute;inset:2px 6px 0 6px}
.row{height:24.5px;display:flex;align-items:center;padding:0 6px;font-size:15px;font-weight:600;letter-spacing:.4px;white-space:nowrap;border-radius:1px}
.row .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.row .ch{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);margin:0 3px 0 6px;flex:none}
.row .vl{margin-left:8px;flex:none;font-weight:500}
.row.sel{background:linear-gradient(180deg,#4a5058,#2b2f35);color:#e8eef7}
.list.scroll .row{margin-right:10px}
.sb{position:absolute;right:0;top:2px;bottom:4px;width:8px;border:1.5px solid #2c3036;border-radius:1px;display:none}
.sb.on{display:block}.sb i{position:absolute;left:1px;right:1px;background:#2c3036;min-height:6px}
.empty{padding:40px 10px;text-align:center;font-size:15px;font-weight:600}
/* now playing */
.np{padding:4px 8px;font-weight:600}
.np .idx{font-size:12px;letter-spacing:.4px;height:16px}
.np .ln{font-size:15px;text-align:center;height:20px;line-height:20px;overflow:hidden;white-space:nowrap;letter-spacing:.4px}
.mq{display:inline-block}
.mq.run{animation:mq var(--d,8s) linear infinite;padding-left:0}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--x))}}
.prog{position:relative;margin:12px 2px 0;height:12px;border:1.5px solid #2c3036;border-radius:6px;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#4a5058,#2b2f35)}
.prog b{position:absolute;top:-1px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg) scale(.8);background:#22262b;border:1.5px solid #e5eefb;display:none}
.prog.seek{overflow:visible}.prog.seek b{display:block}
.times{display:flex;justify-content:space-between;font-size:13px;margin-top:5px;padding:0 2px}
.vol{display:none;align-items:center;gap:6px;margin:12px 2px 0}
.vol .prog{flex:1;margin:0}
.spk{width:12px;height:12px;position:relative;flex:none}
.spk::before{content:"";position:absolute;left:0;top:3px;width:4px;height:6px;background:#22262b}
.spk::after{content:"";position:absolute;left:2px;top:0;border-right:6px solid #22262b;border-top:6px solid transparent;border-bottom:6px solid transparent;height:0}
.spk.hi{width:16px}.spk.hi i{position:absolute;right:0;top:2px;width:5px;height:8px;border:2px solid #22262b;border-left:0;border-radius:0 6px 6px 0}
.np.showvol .vol{display:flex}.np.showvol .pwrap{display:none}
/* boot */
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:600}
.boot .hint{font-size:13px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
/* search */
.srch{padding:6px 8px}
.q{height:26px;border:1.5px solid #2c3036;border-radius:3px;padding:0 6px;display:flex;align-items:center;font-size:15px;font-weight:600;overflow:hidden;white-space:nowrap}
.q .cur{display:inline-block;width:2px;height:15px;background:#22262b;margin-left:1px;animation:blink 1s steps(2) infinite}
.strip{position:relative;margin-top:14px;height:34px;overflow:hidden;border-top:1.5px solid #2c3036;border-bottom:1.5px solid #2c3036}
.strip .cs{position:absolute;top:0;height:31px;display:flex;transition:transform .08s linear}
.strip .c{width:26px;height:31px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none}
.strip .c.w{width:52px;font-size:12px}
.strip .c.sel{background:linear-gradient(180deg,#4a5058,#2b2f35);color:#e8eef7}
.shint{font-size:11.5px;margin-top:10px;line-height:15px;text-align:center;font-weight:500}
/* about */
.about{padding:6px 10px;font-size:14px;font-weight:600}
.about div{display:flex;justify-content:space-between;height:21px;align-items:center}
/* ---------- wheel ---------- */
.wheel{position:absolute;left:50%;top:268px;width:332px;height:332px;margin-left:-166px;border-radius:50%;touch-action:none;cursor:grab;
  background:linear-gradient(160deg,#ffffff,#e6e6e7 55%,#f1f1f2);
  box-shadow:inset 0 0 0 1.5px #c7c8ca,inset 0 3px 6px rgba(255,255,255,.9),inset 0 -6px 12px rgba(0,0,0,.07),0 1px 1px rgba(255,255,255,.9)}
.wheel.grab{cursor:grabbing}
.div{position:absolute;left:50%;top:50%;width:332px;height:1.5px;margin:-.75px 0 0 -166px;background:linear-gradient(90deg,#c4c5c7 0 14%,transparent 14% 86%,#c4c5c7 86%);pointer-events:none}
.seg{position:absolute;font-family:Georgia,"Times New Roman",serif;color:#a3a5a9;pointer-events:none;transition:color .1s}
.seg.down{color:#55585d}
.s-menu{top:10px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.5px;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600}

function setDown(z, on) { if (z && segs[z]) segs[z].classList.toggle("down", on); }
function stopHold() { clearTimeout(W.holdT); clearInterval(W.holdIv); W.holdT = W.holdIv = 0; }
wheel.addEventListener("pointerdown", e => {
  if (W.id !== null || (e.pointerType === "mouse" && e.button !== 0)) return;
  const g = geo(e), z = zoneOf(g); if (!z) return;
  e.preventDefault(); activity();   /* no audio work here: touchstart is not a media gesture on iOS */
  Object.assign(W, { id: e.pointerId, last: g, lastT: e.timeStamp, dir: 0, flip: 0, zone: z, moved: 0, dragging: false, held: false, holdN: 0 });
  try { wheel.setPointerCapture(e.pointerId); } catch (_) {}
  setDown(z, true); wheel.classList.add("grab");
  stopHold();
  if (z === "next" || z === "prev") W.holdT = setTimeout(() => { W.held = true; const d = z === "next" ? 1 : -1; holdSeek(d, W.holdN++); W.holdIv = setInterval(() => holdSeek(d, W.holdN++), T.holdRepeatMs); }, T.holdMs);
  if (z === "center") W.holdT = setTimeout(() => { if (cur().key === "about") { W.held = true; centerHold(); } }, T.aboutHoldMs);
});
wheel.addEventListener("pointermove", e => {
  if (e.pointerId !== W.id) return; e.preventDefault();
  const g = geo(e), p = W.last, dt = e.timeStamp - W.lastT;
  if (W.zone === "center" && !W.dragging) { if (g.d < CENTER_R) return; }
  const min = g.R * T.minChord;
  if (Math.hypot(g.x - p.x, g.y - p.y) < min) return;                 /* too small: wait for more movement */
  W.last = g; W.lastT = e.timeStamp;
  if (segDist2(p, g) < min * min) return;                              /* cut through the dead zone at the hub */
  const d = angDiff(Math.atan2(p.y, p.x) * 180 / Math.PI, Math.atan2(g.y, g.x) * 180 / Math.PI);
  if (!d) return;
  const s = Math.sign(d), ad = Math.abs(d);
  if (W.dir && s !== W.dir) { W.flip += ad; if (W.flip < T.flipDeg) return; }  /* direction-flip smoothing */
  W.dir = s; W.flip = 0;
  if (!W.dragging) { W.dragging = true; setDown(W.zone, false); stopHold(); }

});
function endPointer(e, cancelled) {

  W.id = null; W.zone = null; stopHold(); setDown(z, false); wheel.classList.remove("grab");
  if (cancelled || wasDrag || wasHeld) return;

wheel.addEventListener("pointerup", e => endPointer(e, false));
wheel.addEventListener("pointercancel", e => endPointer(e, true));
wheel.addEventListener("lostpointercapture", e => { if (e.pointerId === W.id) endPointer(e, true); });
wheel.addEventListener("contextmenu", e => e.preventDefault());
/* mouse wheel / trackpad: 1 detent per ~40px */
let wAcc = 0, wLast = 0;
document.addEventListener("wheel", e => {
  if (!$("ipod").contains(e.target)) return;
  e.preventDefault(); ensureAudio();
  wAcc += e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  while (Math.abs(wAcc) >= 40) { const dir = Math.sign(wAcc); wAcc -= dir * 40; const now = performance.now(), dps = wLast ? 15 / Math.max(1, now - wLast) * 1000 : 0; wLast = now;
    W.spin += dir * 15; inner.style.setProperty("--a", W.spin + "deg");
    if (cur().key === "nowplaying" && npMode !== "seek") onRotate(dir * T.volUnitDeg * 2, 0); else if (cur().key === "brick") onRotate(dir * 24, 0); else onRotate(dir * T.listStepDeg, dps); }
}, { passive: false });
/* keyboard */
const keyHold = {};
document.addEventListener("keydown", e => {
  const k = e.key, st = cur().key;
  if (st === "search" && !e.metaKey && !e.ctrlKey) {
    if (/^[a-z0-9]$/i.test(k)) { SR.q = (SR.q + k.toUpperCase()).slice(0, 24); renderSearch(); e.preventDefault(); return; }
    if (k === "Backspace") { SR.q = SR.q.slice(0, -1); renderSearch(); e.preventDefault(); return; }
  }
  const map = { ArrowDown: () => onStep(1), ArrowUp: () => onStep(-1), ArrowRight: () => st === "brick" ? onRotate(24, 0) : (e.repeat ? null : onNext()), ArrowLeft: () => st === "brick" ? onRotate(-24, 0) : (e.repeat ? null : onPrev()),
    Enter: () => e.repeat ? null : onSelect(), " ": () => e.repeat ? null : onPlay(), Escape: onMenu, Backspace: onMenu, m: onMenu, M: onMenu };
  const f = map[k]; if (!f) return; e.preventDefault();
  if (k === "ArrowDown" || k === "ArrowUp") { W.spin += (k === "ArrowDown" ? 15 : -15); inner.style.setProperty("--a", W.spin + "deg"); }
  if ((k === "ArrowRight" || k === "ArrowLeft") && st !== "brick" && e.repeat) { keyHold[k] = (keyHold[k] || 0) + 1; if (keyHold[k] % 4 === 0) holdSeek(k === "ArrowRight" ? 1 : -1, keyHold[k] / 4); return; }
  if (k === "Enter" && st === "about" && !e.repeat) keyHold.enter = setTimeout(centerHold, T.aboutHoldMs);
  f();
});
document.addEventListener("keyup", e => { if (e.key === "Enter") clearTimeout(keyHold.enter); keyHold[e.key] = 0; });

/* ---------------- mini player ---------------- */
$("mplay").onclick = () => { ensureAudio(); activity(); if (cur().key === "boot") { if (!LIB.ready) return; stack = [{ key: "main", sel: 0, top: 0 }]; } togglePlay(); if (P.playing || !A().a.paused) push("nowplaying"); else render(); };
$("mnext").onclick = () => { ensureAudio(); activity(); next(); if (cur().key === "nowplaying") renderNP(); };
let miniSong = null;
function updateMini() {
  const s = curSong();
  $("mplayico").innerHTML = P.playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4.5v15l12.5-7.5z"/>';
  $("mplay").setAttribute("aria-label", P.playing ? "Pause" : "Play"); $("mnext").disabled = !s;
  if (s === miniSong) return; miniSong = s;
  $("mt").textContent = s ? s.name + (s.explicit ? " \u{1F174}" : "") : "Not Playing";
  $("ma").textContent = s ? s.artist : "Press the center button to start";
  const art = $("mart");
  if (s && s.art) { art.style.backgroundImage = "url('" + s.art.replace(/\/\d+x\d+bb\./, "/120x120bb.") + "')"; art.textContent = ""; }
  else { art.style.backgroundImage = ""; art.innerHTML = "&#9835;"; }
  if (s && "mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: s.name, artist: s.artist, album: s.album,
    artwork: s.art ? [{ src: s.art.replace(/\/\d+x\d+bb\./, "/512x512bb."), sizes: "512x512" }] : [] });
}
function updateMiniProgress() { const a = A().a, d = durOf(A()); $("mprog").style.width = (isFinite(d) && d ? 100 * a.currentTime / d : 0) + "%"; }

/* ---------------- backlight ---------------- */
let blT = 0;
function wake() {
  const lcd = $("lcd"); clearTimeout(blT);
  if (S.backlight === "off") { lcd.classList.remove("lit"); return; }
  lcd.classList.add("lit");
  if (S.backlight !== "always") blT = setTimeout(() => lcd.classList.remove("lit"), Number(S.backlight) * 1000);
}
if (darkPref && darkPref.addEventListener) darkPref.addEventListener("change", () => { if (!localStorage.getItem(SKEY)) { S.backlight = DEFAULTS().backlight; wake(); } });

/* ---------------- optional subtle tilt (Settings > 3D Tilt, off by default) ---------------- */
const tilt = $("tilt"); let tdrag = null;
function applySettings() { applyVolume(); if (S.tilt !== "on") tilt.style.transform = ""; wake(); }
document.addEventListener("pointerdown", e => { if (S.tilt !== "on" || wheel.contains(e.target) || $("mini").contains(e.target)) return; tdrag = { x: e.clientX, y: e.clientY }; tilt.classList.add("dragging"); });
document.addEventListener("pointermove", e => { if (!tdrag) return; tilt.style.transform = "rotateX(" + clamp(-(e.clientY - tdrag.y) / 14, -10, 10) + "deg) rotateY(" + clamp((e.clientX - tdrag.x) / 12, -14, 14) + "deg)"; });
document.addEventListener("pointerup", () => { if (!tdrag) return; tdrag = null; tilt.classList.remove("dragging"); tilt.style.transform = ""; });

/* ---------------- layout ---------------- */
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight, brand = $("brand").textContent ? 20 : 0;
  const s = Math.min(1, (vw - 16) / 400, (vh - 84 - 24 - brand - (vh > 820 ? 60 : 0)) / 672);
  const sc = Math.max(0.4, s);
  $("scaler").style.setProperty("--s", sc); $("scaler").style.height = (672 * sc) + "px";
}
window.addEventListener("resize", fit);
let toastT = 0;
function toast(m) { const t = $("toast"); t.textContent = m; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2500); }

/* ---------------- boot ---------------- */
fit(); applySettings(); render(); updateMini();
fetch(DATA_URL, { credentials: "omit" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { ingest(d); cuePreload(); fit(); if (cur().key === "boot") render(); })
  .catch(err => { LIB.failed = true; console.error("songs.json failed", err); render(); });
window.__pod = { T, seek: t => { A().a.currentTime = t; }, dur: () => durOf(A()), onRotate, onSelect, onMenu, onPlay, onNext, onPrev,
  state: () => ({ want: wantPlay, paused: A().a.paused, ready: A().a.readyState, cued: !!P.cued, mini: $("mt").textContent, art: $("mart").style.backgroundImage.slice(0, 60), main: SCREENS.main.items().map(i => i.label), view: cur().key, stack: stack.map(s => s.key), sel: cur().sel, title: $("title").textContent, song: curSong() && curSong().name, playing: P.playing, vol: S.volume, np: npMode,
    songs: LIB.songs.length, artists: LIB.artists.length, playlists: LIB.playlists.map(p => p.name), webAudio, actx: actx && actx.state, t: A().a.currentTime, lit: $("lcd").classList.contains("lit"), ch: curCh }) };
</script>
