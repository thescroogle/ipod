<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#161617">
<title>Pod Classic — web player</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23eee%22/%3E%3Ccircle cx=%228%22 cy=%2210%22 r=%224%22 fill=%22none%22 stroke=%22%23999%22/%3E%3Crect x=%224%22 y=%222%22 width=%228%22 height=%224%22 fill=%22%23b7cae5%22/%3E%3C/svg%3E">
<style>
@font-face{font-family:"PodPixel";src:url(data:font/ttf;base64,__FONT__) format("truetype");font-weight:100 900;font-display:block}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#161617;color:#eee;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  background:radial-gradient(ellipse at 50% 35%,#2a2a2d 0,#161617 60%)}
#stage{position:relative;flex:1;width:100%;display:flex;align-items:flex-start;justify-content:center;perspective:1400px;padding-top:calc(16px + env(safe-area-inset-top))}
#scaler{transform-origin:top center;transform:scale(var(--s,1))}
#tilt{transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
#tilt.dragging{transition:none}
/* ---------- body ---------- */
.ipod{position:relative;width:400px;height:664px;border-radius:38px;padding:3px;
  background:linear-gradient(135deg,#fdfdfd 0,#c9cacc 18%,#f4f4f5 40%,#a9abaf 62%,#eeeeef 82%,#b7b8bb 100%);
  box-shadow:0 30px 50px -18px rgba(0,0,0,.65),0 2px 3px rgba(0,0,0,.4);
  -webkit-box-reflect:below 8px linear-gradient(transparent 72%,rgba(255,255,255,.07) 86%,rgba(255,255,255,.26) 100%);}
.ipod::after{content:"";position:absolute;left:8%;right:8%;bottom:-26px;height:26px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%);filter:blur(6px);z-index:-1}
.face{position:relative;width:100%;height:100%;border-radius:35px;overflow:hidden;
  background:linear-gradient(160deg,#ffffff 0,#f3f3f3 35%,#e9e9ea 70%,#f6f6f6 100%);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 6px rgba(0,0,0,.08),inset 0 0 0 1px rgba(0,0,0,.06)}
.face::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.85) 0,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 68%,rgba(255,255,255,.35) 100%)}
/* ---------- screen ---------- */
.bezel{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:262px;height:198px;border-radius:9px;
  background:linear-gradient(180deg,#5a5c5f,#3c3e41);padding:8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 #fff}
.lcd{position:relative;width:100%;height:100%;border-radius:3px;overflow:hidden;font-family:"PodPixel",monospace;color:#22262b;
  background:linear-gradient(180deg,#bcc0b8,#a9ada5);transition:background .4s,filter .4s}
.lcd.lit{background:linear-gradient(170deg,#e5eefb 0,#c6d6ec 55%,#b7cae5 100%)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 2px),linear-gradient(160deg,rgba(255,255,255,.35),transparent 40%)}
.bar{position:relative;height:25px;margin:0 6px;border-bottom:2px solid #2c3036;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;letter-spacing:.5px}
.bar .ttl{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .pl{position:absolute;left:1px;top:7px;width:0;height:0;border-left:9px solid #22262b;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent;display:none}
.bar .pl.paused{border:0;width:9px;height:11px;top:7px;background:linear-gradient(90deg,#22262b 0 3px,transparent 3px 6px,#22262b 6px 9px)}
.bar .pl.on{display:block}
.batt{position:absolute;right:0;top:7px;width:22px;height:11px;border:1.5px solid #22262b;border-radius:2px;padding:1px;display:flex;gap:1px}
.batt::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:#22262b}
.batt i{flex:1;background:#22262b}
.view{position:absolute;left:0;right:0;top:27px;bottom:0}
/* list */
.list{position:absolute;inset:2px 6px 0 6px}
.row{height:24.5px;display:flex;align-items:center;padding:0 6px;font-size:15px;font-weight:600;letter-spacing:.4px;white-space:nowrap;border-radius:1px}
.row .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.row .ch{width:8px;height:8px;border-right:2px solid currentColor;border-top:2px solid currentColor;transform:rotate(45deg);margin:0 3px 0 6px;flex:none}
.row .vl{margin-left:8px;flex:none;font-weight:500}
.row.sel{background:linear-gradient(180deg,#4a5058,#2b2f35);color:#e8eef7}
.list.scroll .row{margin-right:10px}
.sb{position:absolute;right:0;top:2px;bottom:4px;width:8px;border:1.5px solid #2c3036;border-radius:1px;display:none}
.sb.on{display:block}.sb i{position:absolute;left:1px;right:1px;background:#2c3036;min-height:6px}
.empty{padding:40px 10px;text-align:center;font-size:15px;font-weight:600}
/* now playing */
.np{padding:4px 8px;font-weight:600}
.np .idx{font-size:12px;letter-spacing:.4px;height:16px}
.np .ln{font-size:15px;text-align:center;height:20px;line-height:20px;overflow:hidden;white-space:nowrap;letter-spacing:.4px}
.mq{display:inline-block}
.mq.run{animation:mq var(--d,8s) linear infinite;padding-left:0}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(var(--x))}}
.prog{position:relative;margin:12px 2px 0;height:12px;border:1.5px solid #2c3036;border-radius:6px;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#4a5058,#2b2f35)}
.prog b{position:absolute;top:-1px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg) scale(.8);background:#22262b;border:1.5px solid #e5eefb;display:none}
.prog.seek{overflow:visible}.prog.seek b{display:block}
.times{display:flex;justify-content:space-between;font-size:13px;margin-top:5px;padding:0 2px}
.vol{display:none;align-items:center;gap:6px;margin:12px 2px 0}
.vol .prog{flex:1;margin:0}
.spk{width:12px;height:12px;position:relative;flex:none}
.spk::before{content:"";position:absolute;left:0;top:3px;width:4px;height:6px;background:#22262b}
.spk::after{content:"";position:absolute;left:2px;top:0;border-right:6px solid #22262b;border-top:6px solid transparent;border-bottom:6px solid transparent;height:0}
.spk.hi{width:16px}.spk.hi i{position:absolute;right:0;top:2px;width:5px;height:8px;border:2px solid #22262b;border-left:0;border-radius:0 6px 6px 0}
.np.showvol .vol{display:flex}.np.showvol .pwrap{display:none}
/* boot */
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:600}
.boot .hint{font-size:13px;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
/* search */
.srch{padding:6px 8px}
.q{height:26px;border:1.5px solid #2c3036;border-radius:3px;padding:0 6px;display:flex;align-items:center;font-size:15px;font-weight:600;overflow:hidden;white-space:nowrap}
.q .cur{display:inline-block;width:2px;height:15px;background:#22262b;margin-left:1px;animation:blink 1s steps(2) infinite}
.strip{position:relative;margin-top:14px;height:34px;overflow:hidden;border-top:1.5px solid #2c3036;border-bottom:1.5px solid #2c3036}
.strip .cs{position:absolute;top:0;height:31px;display:flex;transition:transform .08s linear}
.strip .c{width:26px;height:31px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none}
.strip .c.w{width:52px;font-size:12px}
.strip .c.sel{background:linear-gradient(180deg,#4a5058,#2b2f35);color:#e8eef7}
.shint{font-size:11.5px;margin-top:10px;line-height:15px;text-align:center;font-weight:500}
/* about */
.about{padding:6px 10px;font-size:14px;font-weight:600}
.about div{display:flex;justify-content:space-between;height:21px;align-items:center}
/* ---------- wheel ---------- */
.wheel{position:absolute;left:50%;top:268px;width:332px;height:332px;margin-left:-166px;border-radius:50%;touch-action:none;cursor:grab;
  background:linear-gradient(160deg,#ffffff,#e6e6e7 55%,#f1f1f2);
  box-shadow:inset 0 0 0 1.5px #c7c8ca,inset 0 3px 6px rgba(255,255,255,.9),inset 0 -6px 12px rgba(0,0,0,.07),0 1px 1px rgba(255,255,255,.9)}
.wheel.grab{cursor:grabbing}
.div{position:absolute;left:50%;top:50%;width:332px;height:1.5px;margin:-.75px 0 0 -166px;background:linear-gradient(90deg,#c4c5c7 0 14%,transparent 14% 86%,#c4c5c7 86%);pointer-events:none}
.seg{position:absolute;font-family:Georgia,"Times New Roman",serif;color:#a3a5a9;pointer-events:none;transition:color .1s}
.seg.down{color:#55585d}
.s-menu{top:10px;left:0;right:0;text-align:center;font-size:16px;letter-spacing:.5px;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:600}
.s-prev{left:14px;top:50%;margin-top:-6px}.s-next{right:14px;top:50%;margin-top:-6px}
.s-play{bottom:13px;left:0;right:0;display:flex;justify-content:center}
.ico{display:flex;align-items:center;gap:0}
.tri{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent}
.tri.r{border-left:7px solid currentColor}.tri.l{border-right:7px solid currentColor}
.bar1{width:2px;height:10px;background:currentColor}
.inner{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;pointer-events:none;
  background:linear-gradient(150deg,#fbfbfb,#ececed 60%,#f6f6f7);
  box-shadow:0 0 0 1.5px #c4c5c7,0 -2px 5px rgba(0,0,0,.08),inset 0 2px 2px #fff,inset 0 -3px 10px rgba(0,0,0,.06)}
.inner.spin{background:conic-gradient(from var(--a,0deg),#f7f7f8,#ececed,#f7f7f8,#e9e9ea,#f7f7f8)}
.center{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;pointer-events:none;
  background:linear-gradient(160deg,#f1f1f2,#e1e1e3);box-shadow:0 0 0 1.5px #bfc0c2,inset 0 2px 3px #fff,inset 0 -3px 6px rgba(0,0,0,.08),0 2px 3px rgba(0,0,0,.08)}
.center.down{background:linear-gradient(160deg,#dcdcde,#ececed);box-shadow:0 0 0 1.5px #b0b1b3,inset 0 3px 6px rgba(0,0,0,.15)}
/* ---------- mini player ---------- */
#mini{flex:none;width:min(440px,calc(100% - 24px));height:60px;margin:0 0 calc(12px + env(safe-area-inset-bottom));border-radius:30px;display:flex;align-items:center;gap:12px;padding:0 10px 0 10px;
  background:rgba(48,48,52,.72);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.4);z-index:5}
#mini .art{width:40px;height:40px;border-radius:7px;background:#3a3a3e center/cover no-repeat;flex:none;display:flex;align-items:center;justify-content:center;color:#8a8a8f;font-size:20px;box-shadow:0 0 0 1px rgba(255,255,255,.06)}
#mini .meta{flex:1;min-width:0;line-height:17px}
#mini .t{font-size:14px;font-weight:600;color:#f2f2f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .a{font-size:12.5px;color:#9b9ba1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini button{background:none;border:0;color:#d8d8dc;width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
#mini button:active{background:rgba(255,255,255,.1)}
#mini button:disabled{opacity:.35}
#mini svg{fill:currentColor}
#toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#aaa;opacity:0;transition:opacity .3s;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
 <div id="scaler"><div id="tilt">
  <div class="ipod" id="ipod"><div class="face">
   <div class="bezel"><div class="lcd lit" id="lcd">
     <div class="bar"><span class="pl" id="playind"></span><span class="ttl" id="title">Pod</span><span class="batt"><i></i><i></i><i></i><i></i></span></div>
     <div class="view" id="view"></div>
   </div></div>
   <div class="wheel" id="wheel" role="application" aria-label="Click wheel. Drag in a circle to scroll." tabindex="0">
     <div class="div" style="transform:rotate(45deg)"></div><div class="div" style="transform:rotate(-45deg)"></div>
     <div class="seg s-menu" id="seg-menu">menu</div>
     <div class="seg s-prev ico" id="seg-prev"><span class="bar1"></span><span class="tri l"></span><span class="tri l"></span></div>
     <div class="seg s-next ico" id="seg-next"><span class="tri r"></span><span class="tri r"></span><span class="bar1"></span></div>
     <div class="seg s-play ico" id="seg-play"><span class="tri r"></span><span style="width:3px"></span><span class="bar1"></span><span style="width:2px"></span><span class="bar1"></span></div>
     <div class="inner" id="inner"></div>
     <div class="center" id="center"></div>
   </div>
  </div></div>
 </div></div>
</div>
<div id="mini">
  <div class="art" id="mart">&#9835;</div>
  <div class="meta"><div class="t" id="mt">Not Playing</div><div class="a" id="ma">Press the center button to start</div></div>
  <button id="mplay" aria-label="Play"><svg width="22" height="22" viewBox="0 0 24 24" id="mplayico"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
  <button id="mnext" aria-label="Next track"><svg width="28" height="22" viewBox="0 0 28 24"><path d="M2 5v14l11-7zM14 5v14l11-7z"/></svg></button>
</div>
<div id="toast"></div>
<audio id="audio" preload="auto" crossorigin="anonymous" playsinline></audio>
<script>
"use strict";
/* Library seed: built from the public iTunes Search API (see build/fetch_data.py). */
const SEED = __LIB__;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- settings ---------------- */
const SKEY = "podclone:settings";
const DEFAULTS = { shuffle: "off", repeat: "off", clicker: "on", backlight: 10, tilt: "off", volume: 0.7 };
let S = Object.assign({}, DEFAULTS);
try { Object.assign(S, JSON.parse(localStorage.getItem(SKEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };

/* ---------------- library ---------------- */
const LIB = { songs: new Map(), playlists: [], search: [] };
function addSong(x) {
  if (!x || !x.preview) return null;
  if (!LIB.songs.has(x.id)) LIB.songs.set(x.id, x);
  return LIB.songs.get(x.id);
}
function fromItunes(r) {
  return { id: String(r.trackId), name: r.trackName, artist: r.artistName, album: r.collectionName || "",
           art: r.artworkUrl100 || "", preview: r.previewUrl, dur: r.trackTimeMillis || 30000, year: (r.releaseDate || "").slice(0, 4) };
}
SEED.songs.forEach(addSong);
LIB.playlists = SEED.playlists.map(p => ({ name: p.name, ids: p.songIds.filter(id => LIB.songs.has(id)) }));
const allSongs = () => [...LIB.songs.values()].sort((a, b) => a.name.localeCompare(b.name));
const artistName = s => s.artist.split(/,| & | feat\.? | featuring /i)[0].trim();
function artists() {
  const m = new Map();
  for (const s of LIB.songs.values()) { const a = artistName(s); if (!m.has(a)) m.set(a, []); m.get(a).push(s); }
  return [...m.entries()].sort((a, b) => a[0].replace(/^the /i, "").localeCompare(b[0].replace(/^the /i, "")));
}

/* iTunes API: fetch first, JSONP fallback if CORS/network blocks fetch */
let jsonpN = 0;
function itunes(path, params) {
  const qs = new URLSearchParams(Object.assign({ country: "us" }, params)).toString();
  const url = "https://itunes.apple.com/" + path + "?" + qs;
  return fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(() => new Promise((res, rej) => {
    const cb = "__itcb" + (++jsonpN), sc = document.createElement("script");
    const t = setTimeout(() => { cleanup(); rej(new Error("timeout")); }, 12000);
    function cleanup() { clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    sc.onerror = () => { cleanup(); rej(new Error("jsonp failed")); };
    sc.src = url + "&callback=" + cb; document.head.appendChild(sc);
  }));
}
/* Optional: ?am=<music.apple.com album/song URL> seeds a playlist via the lookup API */
function loadAppleMusicLink(link) {
  const m = link.match(/\/(album|song|playlist)\/[^/]*\/?([0-9]+|pl\.[a-z0-9]+)/i) || link.match(/[?&]i=(\d+)/);
  if (!m) { toast("Apple Music link not recognised"); return; }
  const id = (link.match(/[?&]i=(\d+)/) || [])[1] || m[2];
  if (/^pl\./.test(id)) { toast("Playlists need a MusicKit token; not supported"); return; }
  itunes("lookup", { id, entity: "song", limit: 200 }).then(d => {
    const ids = d.results.filter(r => r.wrapperType === "track" && r.previewUrl).map(r => addSong(fromItunes(r)).id);
    if (ids.length) { const c = d.results[0]; LIB.playlists.unshift({ name: c.collectionName || "From Link", ids }); render(); }
  }).catch(() => toast("Lookup failed"));
}
/* Starter library: a few popular artists fetched live at load (merged with the seed) */
function loadStarter() {
  ["Daft Punk", "Missy Elliott", "Coldplay", "Beyoncé"].forEach((a, i) => setTimeout(() =>
    itunes("search", { term: a, entity: "song", limit: 8, attribute: "artistTerm" }).then(d => {
      d.results.filter(r => r.previewUrl).forEach(r => addSong(fromItunes(r)));
      if (cur().key !== "nowplaying") render();
    }).catch(() => {}), 800 * i));
}

/* ---------------- audio ---------------- */
const audio = $("audio");
let actx = null, gain = null, webAudioOk = false;
function ensureAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      gain = actx.createGain(); gain.connect(actx.destination);
      const src = actx.createMediaElementSource(audio); src.connect(gain); webAudioOk = true;
    } catch (e) { webAudioOk = false; }
    applyVolume();
  }
  if (actx && actx.state !== "running") actx.resume().catch(() => {});
}
function applyVolume() {
  if (webAudioOk && gain) { gain.gain.value = S.volume * S.volume; audio.volume = 1; }
  else audio.volume = S.volume;          /* iOS ignores this; WebAudio path is primary */
}
let lastClick = 0;
function click() {
  if (S.clicker !== "on" || !actx || actx.state !== "running") return;
  const t = actx.currentTime;
  if (t - lastClick < 0.035) return;     /* throttle like a real mechanism */
  lastClick = t;
  const n = Math.floor(actx.sampleRate * 0.006), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
  const src = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain();
  hp.type = "highpass"; hp.frequency.value = 2500; g.gain.value = 0.35;
  src.buffer = buf; src.connect(hp); hp.connect(g); g.connect(actx.destination); src.start(t);
}

/* ---------------- player / queue ---------------- */
const P = { queue: [], order: [], pos: -1, playing: false, everPlayed: false };
const curSong = () => P.pos >= 0 ? P.queue[P.order[P.pos]] : null;
function buildOrder(startIdx) {
  P.order = P.queue.map((_, i) => i);
  if (S.shuffle === "songs") {
    for (let i = P.order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [P.order[i], P.order[j]] = [P.order[j], P.order[i]]; }
    if (startIdx != null) { const k = P.order.indexOf(startIdx); [P.order[0], P.order[k]] = [P.order[k], P.order[0]]; }
    P.pos = 0;
  } else P.pos = startIdx || 0;
}
function playQueue(list, idx) { P.queue = list.slice(); buildOrder(idx); loadCur(true); }
function loadCur(autoplay) {
  const s = curSong(); if (!s) return;
  audio.src = s.preview; audio.currentTime = 0;
  P.everPlayed = true; updateMini();
  if (autoplay) play();
}
function play() { ensureAudio(); const p = audio.play(); if (p) p.catch(() => {}); }
function pause() { audio.pause(); }
function toggle() {
  if (!curSong()) { const a = allSongs(); if (a.length) { playQueue(a, 0); push("nowplaying"); } return; }
  audio.paused ? play() : pause();
}
function next(auto) {
  if (!curSong()) return;
  if (auto && S.repeat === "one") { audio.currentTime = 0; play(); return; }
  if (P.pos < P.order.length - 1) P.pos++;
  else if (S.repeat === "all" || !auto) { if (S.shuffle === "songs" && auto) buildOrder(); P.pos = 0; if (auto && S.repeat !== "all") { pause(); return; } }
